site_name: Mirai Technical Documentation
site_description: >-
  Technical documentation for Mirai, Team Prism's non-diagnostic pre-referral
  observation platform for early childhood educators and parents in Nairobi's
  mid-tier and low-cost private schools.
site_author: Team Prism
site_url: "https://akirachix.github.io/prism-technical-documentation/"
repo_url: https://github.com/akirachix/prism-technical-documentation
repo_name: prism-technical-documentation
edit_uri: edit/main/docs/
copyright: >-
  Mirai &middot; Built by Team Prism (AkiraChix codeHive 2026) &middot;
  A screening support tool. It never gives a diagnosis.

theme:
  name: material
  language: en
  logo: assets/brand/mirai-mark-light.png
  favicon: assets/brand/mirai-mark.png
  font:
    text: Quicksand
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: material/notebook-outline
      info: material/information-outline
      tip: material/lightbulb-on-outline
      warning: material/alert-outline
      danger: material/shield-alert-outline
      example: material/flask-outline
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/zoom.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akirachix/prism-technical-documentation
      name: Documentation repository

nav:
  - Home: index.md
  - Start Here:
      - start-here/index.md
      - Problem and Impact: start-here/problem-and-impact.md
      - Users and Personas: start-here/users-and-personas.md
      - Documentation Guide: start-here/documentation-guide.md
  - Architecture:
      - architecture/index.md
      - System Context: architecture/system-context.md
      - Case Lifecycle: architecture/case-lifecycle.md
      - Data Model: architecture/data-model.md
      - User Flows: architecture/user-flows.md
  - Backend:
      - backend/index.md
      - Screening and Scoring Engine: backend/scoring-engine.md
      - API Reference: backend/api.md
  - AI:
      - ai/index.md
      - IEP and Evaluation Generation: ai/iep-generation.md
  - Frontend:
      - frontend/index.md
      - Screens: frontend/screens.md
      - Style Guide: frontend/style-guide.md
  - Platform:
      - platform/index.md
  - Security:
      - security/index.md
      - Access Control: security/access-control.md
      - Privacy and Compliance: security/privacy-compliance.md
      - Threat Model: security/threat-model.md
  - Developer Guide:
      - developer-guide/index.md
      - Setup: developer-guide/setup.md
      - Testing and QA: developer-guide/testing.md
  - Reference:
      - reference/index.md
      - Glossary: reference/glossary.md
      - Decision Log: reference/decision-log.md
      - Team: reference/team.md
